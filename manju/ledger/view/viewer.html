<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>manju ledger — node graph</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 ui-monospace, Menlo, monospace; background:#0a0a12; color:#e8e8f0; }
  header { padding:10px 14px; background:#13131f; border-bottom:1px solid #2a2a3e; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0; font-weight:600; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:11px; }
  .legend span { display:inline-flex; align-items:center; gap:4px; }
  .dot { width:11px; height:11px; border-radius:2px; display:inline-block; }
  main { display:flex; height:calc(100vh - 46px); }
  #graph { position:relative; flex:1; overflow:auto; }
  svg.edges { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .node { position:absolute; width:150px; border:1px solid #3a3a52; border-radius:6px; background:#15151f;
          cursor:pointer; z-index:1; overflow:hidden; box-shadow:0 1px 4px #0006; }
  .node:hover { outline:2px solid #c8a14a; }
  .node .thumb { width:100%; height:74px; background:#0a0a12 center/cover no-repeat; border-bottom:1px solid #2a2a3e;
                 display:flex; align-items:center; justify-content:center; color:#555; font-size:10px; }
  .node .meta { padding:5px 7px; }
  .node .id { font-size:11px; word-break:break-all; }
  .node .bar { height:5px; }
  .badge { position:absolute; top:4px; right:4px; background:#000a; border:1px solid #c8a14a; color:#c8a14a;
           border-radius:9px; padding:0 6px; font-size:10px; line-height:15px; }
  .kind { position:absolute; top:4px; left:4px; background:#000a; border-radius:3px; padding:0 5px; font-size:9px; color:#9a9ab0; }
  aside { width:340px; background:#101019; border-left:1px solid #2a2a3e; overflow:auto; padding:12px; }
  aside h2 { font-size:13px; margin:0 0 8px; word-break:break-all; }
  aside pre { white-space:pre-wrap; word-break:break-word; background:#0a0a12; border:1px solid #222; border-radius:4px; padding:8px; font-size:11px; }
  .film { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .take { border:1px solid #333; border-radius:4px; padding:5px; font-size:10px; min-width:96px; }
  .take .v { margin-top:3px; }
  input[type=file] { font-size:11px; }
  .hint { color:#888; }
</style>
</head>
<body>
<header>
  <h1>manju ledger</h1>
  <input type="file" id="file" accept="application/json">
  <span class="hint" id="src"></span>
  <div class="legend" id="legend"></div>
</header>
<main>
  <div id="graph"><svg class="edges" id="edges"></svg></div>
  <aside id="detail"><span class="hint">click a node</span></aside>
</main>
<script>
// color = status (shots) / ref_status (assets)
const COLORS = {
  pending:"#5a5a6e", generating:"#3b82f6", landed:"#8b5cf6", judging:"#eab308",
  approved:"#22c55e", needs_regen:"#f97316", paused:"#94a3b8", blocked_on_ref:"#ef4444", skipped:"#475569",
  none:"#5a5a6e", drafting:"#3b82f6", locked:"#22c55e", rejected:"#ef4444"
};
const COLS = { asset:0, "ep":1 };
let DOC = null;

function legend() {
  const wanted = ["pending","generating","landed","judging","approved","needs_regen","blocked_on_ref","paused","skipped"];
  document.getElementById("legend").innerHTML = wanted
    .map(s => `<span><i class="dot" style="background:${COLORS[s]}"></i>${s}</span>`).join("");
}

// flatten the tree into renderable {id, kind, status, deps, thumb, attempts, plan} nodes
function collect(doc) {
  const out = [];
  const b = doc.bible || {};
  for (const bucket of ["characters","scenes","props","villains"])
    for (const a of (b[bucket]||[]))
      out.push({ id:a.id, kind:"asset", status:(a.run||{}).ref_status||"none",
                 deps:[], thumb:thumbOf(a), attempts:(a.run||{}).attempts||[], plan:a.plan||{} });
  for (const ep of (doc.episodes||[]))
    for (const sc of (ep.scenes||[]))
      for (const sh of (sc.shots||[]))
        out.push({ id:sh.id, kind:"shot", status:(sh.run||{}).status||"pending",
                   deps:sh.deps||[], thumb:thumbOf(sh), attempts:(sh.run||{}).attempts||[], plan:sh.plan||{} });
  return out;
}
// the ledger stores thumb/artifact paths REPO-ROOT-relative ("projects/<n>/..."),
// but this viewer lives at manju/ledger/view/. Rewrite repo-root-relative paths so
// they resolve from here when served over http from the repo root. Absolute paths
// (http(s)://, file://, or a leading "/") are passed through untouched.
function resolveAsset(p){
  if (!p) return "";
  if (/^([a-z]+:)?\/\//i.test(p) || p.startsWith("/")) return p;
  if (p.startsWith("projects/")) return "../../../" + p;
  return p;
}
function thumbOf(n){ const a=(n.run||{}).current_artifact; return a ? resolveAsset(a.thumb_path||a.path||"") : ""; }

function depth(id, byId, seen){ // longest dep chain → x column
  const n = byId[id]; if (!n || !n.deps.length) return n && n.kind==="asset" ? 0 : 1;
  if (seen.has(id)) return 0; seen.add(id);
  let d = 1; for (const dep of n.deps) if (byId[dep]) d = Math.max(d, depth(dep,byId,seen)+1);
  return d;
}

function render(doc) {
  DOC = doc;
  const graph = document.getElementById("graph");
  const svg = document.getElementById("edges");
  [...graph.querySelectorAll(".node")].forEach(e=>e.remove());
  svg.innerHTML = "";
  const nodes = collect(doc);
  const byId = {}; nodes.forEach(n => byId[n.id] = n);
  const colOf = {}; const rowOf = {};
  nodes.forEach(n => colOf[n.id] = depth(n.id, byId, new Set()));
  const colCount = {};
  nodes.forEach(n => { const c = colOf[n.id]; rowOf[n.id] = (colCount[c]||0); colCount[c] = (colCount[c]||0)+1; });
  const W=150, H=120, GX=70, GY=24, X0=24, Y0=24;
  const pos = {};
  nodes.forEach(n => {
    const x = X0 + colOf[n.id]*(W+GX), y = Y0 + rowOf[n.id]*(H+GY);
    pos[n.id] = {x,y};
    const el = document.createElement("div");
    el.className = "node"; el.style.left = x+"px"; el.style.top = y+"px";
    const thumb = n.thumb ? `style="background-image:url('${n.thumb}')"` : "";
    el.innerHTML =
      `<div class="kind">${n.kind}</div>` +
      (n.attempts.length ? `<div class="badge">${n.attempts.length}×</div>` : "") +
      `<div class="thumb" ${thumb}>${n.thumb?"":"no artifact"}</div>` +
      `<div class="bar" style="background:${COLORS[n.status]||"#666"}"></div>` +
      `<div class="meta"><div class="id">${n.id}</div>` +
      `<div class="hint">${n.status}</div></div>`;
    el.onclick = () => detail(n);
    graph.appendChild(el);
  });
  // edges
  let maxX=0, maxY=0;
  nodes.forEach(n => { maxX=Math.max(maxX,pos[n.id].x+W); maxY=Math.max(maxY,pos[n.id].y+H); });
  svg.style.width = (maxX+40)+"px"; svg.style.height = (maxY+40)+"px";
  nodes.forEach(n => n.deps.forEach(d => {
    if(!pos[d]) return;
    const a=pos[d], b=pos[n.id];
    const x1=a.x+W, y1=a.y+H/2, x2=b.x, y2=b.y+H/2;
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M${x1},${y1} C${x1+35},${y1} ${x2-35},${y2} ${x2},${y2}`);
    p.setAttribute("stroke","#3a3a52"); p.setAttribute("fill","none"); p.setAttribute("stroke-width","1.5");
    svg.appendChild(p);
  }));
}

function detail(n) {
  const films = n.attempts.map((a,i) => {
    const v = a.verdict || {};
    return `<div class="take"><b>#${i+1}</b><div class="v">seed: ${a.seed??"–"}</div>`+
           `<div class="v">model: ${a.model||"–"}</div>`+
           `<div class="v">verdict: ${v.pass===undefined?"–":(v.pass?"pass":(v.failure_mode||"fail"))}</div></div>`;
  }).join("") || `<span class="hint">no attempts yet</span>`;
  document.getElementById("detail").innerHTML =
    `<h2>${n.id} <span class="hint">(${n.kind} · ${n.status})</span></h2>`+
    `<b>plan</b><pre>${JSON.stringify(n.plan,null,2)}</pre>`+
    `<b>deps</b><pre>${(n.deps||[]).join("\n")||"–"}</pre>`+
    `<b>attempts (${n.attempts.length})</b><div class="film">${films}</div>`;
}

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  document.getElementById("src").textContent = f.name;
  const r = new FileReader();
  r.onload = () => render(JSON.parse(r.result));
  r.readAsText(f);
});

legend();
// default: try the POPULATED demo_run first (thumbnails + statuses + attempt badges),
// then fall back to the empty demo fixture. Repo-root-relative paths match how the
// ledger stores thumb_path, so served over http from the repo root the thumbnails
// resolve. (Loading via the file-input always works; thumbnails resolve when served
// from the repo root.)
const CANDIDATES = [
  "../../../projects/demo_run/ledger.json", "projects/demo_run/ledger.json", "/projects/demo_run/ledger.json",
  "../../../projects/demo/ledger.json", "projects/demo/ledger.json", "/projects/demo/ledger.json"
];
(async () => {
  for (const url of CANDIDATES) {
    try {
      const res = await fetch(url);
      if (res.ok) { document.getElementById("src").textContent = url; render(await res.json()); return; }
    } catch (_) {}
  }
  document.getElementById("src").textContent = "(choose a ledger.json — file:// blocks fetch)";
})();
</script>
</body>
</html>
